    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/products/
